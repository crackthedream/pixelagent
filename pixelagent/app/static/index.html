<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelAgent</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' rx='2' fill='%235E5CE6'/%3E%3Crect x='2' y='2' width='2' height='2' fill='%23fff'/%3E%3Crect x='4' y='4' width='2' height='2' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 19.5c1.2-3.6 4-5.3 7-5.3s5.8 1.7 7 5.3"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 5v14M16 5v14M4 9.5h4M4 14.5h4M16 9.5h4M16 14.5h4"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4.2 4.2 8.8-9.4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5v4h-4"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 14.5V3.5M8 7.5l4-4 4 4"/><path d="M7 10.5H5.5v9h13v-9H17"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5z"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4.5 17.5 4.8-4.6 3.4 3 2.6-2.3 4.2 3.9"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H20M17 12v3M14.5 12v2"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M9.5 5v14M5.8 8.5h1.6M5.8 11h1.6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M15.5 5.5 18.5 8.5 9 18H6v-3z"/><path d="m13.5 7.5 3 3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 4.5h4M6.5 7l.9 11.2a2 2 0 0 0 2 1.8h5.2a2 2 0 0 0 2-1.8L17.5 7"/><path d="M10.2 10.5v6M13.8 10.5v6"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>PixelAgent</div>
    <nav>
      <div class="side-head">Library</div>
      <a class="side-item" data-view="characters" href="#/characters"><svg class="ic"><use href="#i-person"/></svg>Characters<span class="badge" id="badge-characters" hidden></span></a>
      <a class="side-item" data-view="animations" href="#/animations"><svg class="ic"><use href="#i-film"/></svg>Animations<span class="badge" id="badge-animations" hidden></span></a>
      <div class="side-head">Projects</div>
      <div id="project-list"></div>
      <button class="side-item side-add" id="btn-new-project"><svg class="ic"><use href="#i-plus"/></svg>New project</button>
      <a class="side-item" data-view="deleted" href="#/deleted" id="side-deleted"><svg class="ic"><use href="#i-trash"/></svg>Recently Deleted<span class="count" id="count-deleted" hidden></span></a>
    </nav>
    <div class="side-foot">
      <div class="spend" id="spend" title="Estimated API spend this month">
        <div class="spend-row"><span>This month</span><span id="spend-text">–</span></div>
        <div class="meter"><div class="meter-fill" id="spend-fill"></div></div>
      </div>
      <a class="side-item" data-view="settings" href="#/settings"><svg class="ic"><use href="#i-gear"/></svg>Settings</a>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar" id="toolbar"></header>
    <div class="content" id="content" tabindex="-1"></div>
  </main>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="alert-backdrop" id="alert-backdrop" hidden><div class="alert" id="alert" role="alertdialog" aria-modal="true"></div></div>

<script src="/static/app.js"></script>
</body>
</html>
