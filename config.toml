# pixelagent default configuration. A project folder may contain its own config.toml that overrides these keys.

[engine]
# The PixelLiner MCP engine (imported as a library; launched as an MCP server for the artist agent).
path = "~/pixelliner-mcp"
pixelliner_exe = "C:/Program Files/PixelLiner/PixelLiner.exe"

[backend]
# "dry_run" = stub models, no API calls. "openai" = real models (key from the OPENAI_API_KEY environment
# variable only; it is never written to config, logs or review pages).
mode = "dry_run"
timeout_s = 240
max_retries = 4
max_image_side = 1024        # images sent to models are downscaled to this (saves input tokens)

# Model per role (OpenAI IDs as listed on developers.openai.com/api/docs/models, Nov 2026).
[models]
director = "gpt-6.1-sol"
vision_pick = "gpt-6.1-terra"
labeler = "gpt-6.1-terra"
detail = "gpt-6.1-sol"
repair = "gpt-6.1-sol"
animator = "gpt-6.1-sol"
critic = "gpt-6.1-terra"
final_critic = "gpt-6-astra"
utility = "gpt-6-luna"
artist = "gpt-6.1-sol"           # draws the sprite itself through the pixelliner MCP tools
image_draft = "gpt-image-2.6-flare"
image_final = "gpt-image-2.6-sunburst"

# Reasoning effort per role (none | minimal | low | medium | high | xhigh | max).
[reasoning]
director = "medium"
detail = "medium"
vision_pick = "low"
labeler = "low"
critic = "medium"
final_critic = "high"
utility = "none"

[images]
draft_size = "1024x1536"     # portrait suits full-body characters
draft_quality = "medium"
final_quality = "high"
background = "opaque"        # concepts are generated on a flat background that the pipeline removes
matmap_quality = "medium"     # material map (flat key-colour segmentation of the concept)
input_fidelity = ""          # "high" for edit models that support it (gpt-image-2.6-sunburst does not)

[matmap]
min_iou = 0.85               # map silhouette must overlap the concept silhouette this well
max_unknown = 0.15           # max share of concept pixels whose map colour matches no key

[app]
# The agent's focus is characters and their expressions (owner, 2026-11-12). The parts below are off: hidden in the
# app, new ones refused, their code and existing items untouched. true switches one back on.
backgrounds = false          # Scenes and Kits (experimental)
animations = false           # Animations and Move set: moves made from one static sprite rated 3.57 of 5 against
                             # 4.32 for expressions, and fail on a front-facing or seated sprite (docs/FACE_ROOT_CAUSE.md)

[scene]
height = 540                 # a backdrop layer's height in pixels at the characters' 1x scale (one screen)
quality = "medium"           # image quality for scene layers and seam repaints
min_repeat = 0.75            # a layer is cut to repeat at no less than this share of the screen's width
seam_blend = 32              # columns dithered from the layer's continuation into its start where it repeats
sky_blend = 96               # the same for the sky (no detail to ghost, so a wider, gentler blend)
seam_limit = 30.0            # a cut whose ends still differ more than this is flagged (the blend may show a ghost)

[kit]
quality = "medium"           # image quality for the kit sheet
colours = 48                 # one palette for the whole kit (tiles and decorations)
tile_blend = 8               # columns/rows dithered in so repeating tiles wrap onto themselves

[concept]
refine_after_pick = false    # true: after gate B, polish the picked draft with images.edit on image_final
heads_range = [4.0, 5.0]     # soft look: a concept whose reduced figure is outside this many heads tall is redone
proportion_retries = 1       # ... at most this many times, with a correction note. The owner's ratings of the ten
                             # references (2026-11-10) were best at 4.2-5.0 heads and lowest on the chibi side.
clean_reference = "auto"     # "auto": redraw a reference into a clean full-body concept (images.edit) when it has
                             # scenery or a partial figure; true: always also redraw; false: never (convert as is)

# USD per 1M tokens. Text models: from developers.openai.com/api/docs/models (Nov 2026).
# Image models: no official prices were listed there; these are third-party figures -- VERIFY on your
# billing page. costs.jsonl keeps the raw token counts, so costs can be recomputed later.
[pricing."gpt-6-astra"]
input = 10.0
output = 50.0
[pricing."gpt-6.1-sol"]
input = 2.0
output = 10.0
[pricing."gpt-6.1-terra"]
input = 1.0
output = 5.0
[pricing."gpt-6-luna"]
input = 0.10
output = 0.50
[pricing."gpt-image-2.6-flare"]
text_input = 5.0
image_input = 8.0
output = 30.0
[pricing."gpt-image-2.6-sunburst"]
text_input = 5.0
image_input = 8.0
output = 30.0

[finish]
mode = "native"              # "native": the image model draws the character AS a hand-pixelled sprite (crisp blocks),
                             # read back pixel for pixel, 3-6 tones per material (docs/FACE_ROOT_CAUSE.md section 7).
                             # "reduce": the final sprite is the concept's own reduction with per-material colours
                             # (the soft look; faces and shading stay as the image model drew them, no model redraw;
                             # see docs/FACE_ROOT_CAUSE.md). "artist": the model redraws the sprite over the
                             # conversion via MCP (+ face pass). "repair": LEGACY, not offered in the app (older region
                             # rewrites + critic repairs; kept only for old projects and tests).
grade = "medium"             # native finish palette grade: "none", "soft", "medium" or "strong" -- less saturated,
                             # lifted shadows, like Alice in Cradle's dusty colours; the face keeps its colours
prop_grade = "soft"          # the same for objects and props: lighter, so gold and potion reds stay readable
reduce_colors = 96           # colour budget of the reduce finish, shared by sqrt(area); eyes and mouth get >= 4
max_usd = 1.5                # cap for the artist step per asset (upper bound; cached context is cheaper)
max_turns = 40
face_turns = 12
face_pass = true
cleanup = true                # merge tiny near-shade specks after the drawing (own layer; face untouched)
cleanup_min_cluster = 3
revise_turns = 12             # revising the current drawing with a note (optionally inside an area)
revise_max_usd = 0.30         # cap for one revision (a full redraw costs ~$0.90)
face_rules = "v3"             # "v3": faces built with the engine's face kit (Alice in Cradle-style eyes and soft
                              # mouths); "v1": the model draws the face pixels (compared in benchmarks/face_lab.py)
effort = "medium"

[expressions]
retries = 1                  # a face that fails its check is drawn once more with the findings (the better one kept)
judge = true                 # vision check of each face against the neutral one (~$0.003)
min_skin_kept = 0.5          # the share of the face's main skin colour that must stay as it was

[animation]
sheet_size = "1536x1024"     # pose sheet: all frames in one row
sheet_wide = "3072x1024"     # used instead when the frames would need pixels of under min_block image pixels each
min_block = 5                # the image model draws 3-px pixels as 4-px ones: a third of the frames came out 25% small
sheet_retries = 1            # a sheet whose pixels still come out too coarse is drawn once more (the better one kept)
sheet_quality = "medium"
turns_per_frame = 14         # artist rounds per frame (each frame starts from the previous one)
max_usd = 4.0                # cap for the drawing of one animation (upper bound)
effort = "medium"

[detail]
enabled = true
max_regions = 4              # focal regions refined per sprite (face, hands, held items...)
max_region_side = 24         # px; larger areas are clamped
repair_issues_per_round = 3  # critic issues (with a region) fixed per repair round
repair_candidates = 2        # variants per region in repair rounds (detail pass uses budget.detail_candidates)
fidelity_tolerance = 0.05    # max increase of the region's (3x3-blurred) OKLab distance to the concept; calibrated:
                             # accepted detail edits +0.002..0.039, deleting the knight's shield emblem +0.069
min_gain = 0.25              # a repair round is kept only if quality rises by more than the critic's noise
fidelity_weight = 15.0       # quality = critic overall + lint/50 - fidelity_weight * concept distance

[budget]
# Hard caps. Pro $100 tier = $100 API credit per billing month; leave headroom.
monthly_usd = 90.0
concept_drafts = 4
grid_candidates = 6
critique_rounds = 2          # repair rounds after the first critique
detail_candidates = 3
max_usd_per_asset = 3.0

[style]
# Project style guide: every asset is built to these rules.
light = "top-left"
look = "soft"                # "soft": the look of hand-made anime action-game sprites (Alice in Cradle as the
                             # reference): big head (~4.5 heads tall), light low-contrast colours, soft coloured
                             # outlines, simplified costume. "classic": strict palette, dark outline, the concept's
                             # own proportions.
heads_tall = 4.5             # character proportions for the soft look (Noel ~4.7; owner ratings best at 4.2-5.0)
outline = "soft"             # "soft" (rim in a darker shade of the colour it encloses, no near-black line) |
                             # "selout" | "dark" | "none"
outline_color = "#1b1325"
max_colors = 40              # the soft look needs a few more gentle shades
ramp_steps = 5
hue_shift = 24
prop_size = 48               # default object size in pixels (its longest side): items and props in the game
sprite_height = 160          # default character height in pixels. 160 px gives faces ~16 px wide, the scale of
                             # hand-made anime sprites (Alice in Cradle: ~150 px, faces 16-18 px); at 96 px faces are
                             # 9-13 px and expressions read crude. A real 160-px run cost about the same as 96 px.
canvas_margin = 2            # transparent pixels kept around the sprite
alpha_threshold = 128

[pixelize]
# Grid-alignment search: sub-pixel offsets (fractions of one target pixel) tried per axis.
offsets = [0.0, 0.33, 0.66]
material_clusters = 14       # colour clusters labelled into materials
fidelity_threshold = 0.10    # OKLab distance; beyond it a pixel falls back to the nearest palette colour
min_cluster = 3              # same-shade clusters smaller than this merge into neighbours (low contrast only)

[review]
zoom = 6
