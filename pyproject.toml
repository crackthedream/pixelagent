[project]
name = "pixelagent"
version = "0.1.0"
description = "Reference/prompt to layered pixel-art sprite pipeline built on the PixelLiner MCP engine"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "numpy>=1.26", "pydantic>=2.6"]

[project.optional-dependencies]
openai = ["openai>=2.45.0"]

[project.scripts]
pixelagent = "pixelagent.cli:main"
pixelagent-app = "pixelagent.app.server:main"

[tool.setuptools]
packages = ["pixelagent", "pixelagent.steps", "pixelagent.app"]

[tool.setuptools.package-data]
"pixelagent.app" = ["static/*"]
